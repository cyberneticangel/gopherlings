<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- gopherlings mascot: an original gopher fixing exercises -->
  <circle cx="256" cy="256" r="248" fill="#5FBDB2"/>
  <circle cx="256" cy="256" r="212" fill="#7FD1C7"/>
  <ellipse cx="256" cy="466" rx="168" ry="20" fill="#4DA89E"/>

  <!-- ears -->
  <circle cx="172" cy="118" r="34" fill="#C08552"/>
  <circle cx="340" cy="118" r="34" fill="#C08552"/>
  <circle cx="172" cy="118" r="17" fill="#A9713F"/>
  <circle cx="340" cy="118" r="17" fill="#A9713F"/>

  <!-- head + body -->
  <circle cx="256" cy="205" r="112" fill="#C08552"/>
  <ellipse cx="256" cy="320" rx="158" ry="140" fill="#C08552"/>

  <!-- belly -->
  <ellipse cx="256" cy="330" rx="96" ry="88" fill="#EFD9B4"/>

  <!-- muzzle -->
  <ellipse cx="256" cy="232" rx="62" ry="46" fill="#EFD9B4"/>
  <ellipse cx="256" cy="212" rx="15" ry="11" fill="#8A5A33"/>
  <path d="M256 222 v10 M256 232 q-10 12 -23 4 M256 232 q10 12 23 4"
        fill="none" stroke="#8A5A33" stroke-width="5" stroke-linecap="round"/>
  <!-- buck teeth -->
  <rect x="247" y="236" width="9" height="15" rx="3" fill="#FFFFFF"/>
  <rect x="258" y="236" width="9" height="15" rx="3" fill="#FFFFFF"/>

  <!-- eyes -->
  <circle cx="213" cy="176" r="14" fill="#3B2B20"/>
  <circle cx="299" cy="176" r="14" fill="#3B2B20"/>
  <circle cx="218" cy="171" r="5" fill="#FFFFFF"/>
  <circle cx="304" cy="171" r="5" fill="#FFFFFF"/>

  <!-- whiskers -->
  <g stroke="#A9713F" stroke-width="4" stroke-linecap="round">
    <line x1="192" y1="220" x2="148" y2="210"/>
    <line x1="192" y1="232" x2="148" y2="232"/>
    <line x1="320" y1="220" x2="364" y2="210"/>
    <line x1="320" y1="232" x2="364" y2="232"/>
  </g>

  <!-- laptop -->
  <rect x="188" y="300" width="136" height="104" rx="12" fill="#334155"/>
  <rect x="200" y="312" width="112" height="80" rx="6" fill="#1E293B"/>
  <path d="M238 352 l18 18 l34 -38" fill="none" stroke="#4ADE80"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="172" y="404" width="168" height="18" rx="9" fill="#64748B"/>

  <!-- paws on the keyboard -->
  <ellipse cx="216" cy="402" rx="24" ry="15" fill="#C08552"/>
  <ellipse cx="296" cy="402" rx="24" ry="15" fill="#C08552"/>

  <!-- feet -->
  <ellipse cx="206" cy="452" rx="36" ry="20" fill="#C08552"/>
  <ellipse cx="306" cy="452" rx="36" ry="20" fill="#C08552"/>

  <!-- tests-pass badge -->
  <circle cx="404" cy="120" r="36" fill="#4ADE80"/>
  <path d="M386 120 l13 13 l26 -28" fill="none" stroke="#FFFFFF"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
